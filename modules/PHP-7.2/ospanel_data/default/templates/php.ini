[amqp]

; amqp.auto_ack                 = 0        ; Automatically acknowledge messages
amqp.cacert                     = "{root_dir}/data/ssl/cacert.pem" ; Path to CA certificate
; amqp.cert                     =          ; Path to client certificate
; amqp.channel_max              = 256      ; Max number of channels
; amqp.connect_timeout          = 0        ; Connection timeout
; amqp.frame_max                = 131072   ; Max frame size
; amqp.global_prefetch_count    = 0        ; Global prefetch count
; amqp.global_prefetch_size     = 0        ; Global prefetch size
; amqp.heartbeat                = 0        ; Heartbeat interval
; amqp.host                     = "localhost" ; AMQP server hostname
; amqp.key                      =          ; Path to private key
; amqp.login                    = "guest"  ; Username
; amqp.password                 = "guest"  ; Password
; amqp.port                     = 5672     ; Port
; amqp.prefetch_count           = 3        ; Prefetch message count
; amqp.prefetch_size            = 0        ; Prefetch message size
; amqp.read_timeout             = 0        ; Read timeout
; amqp.rpc_timeout              = 0        ; RPC timeout
; amqp.sasl_method              = 0        ; SASL authentication method
