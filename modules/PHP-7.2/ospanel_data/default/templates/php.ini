; xdebug.profiler_append        = Off      ; Append profiler output
; xdebug.profiler_output_name   = "cachegrind.out.%p" ; Profiler file name
; xdebug.scream                 = Off      ; Disable @ operator
; xdebug.show_error_trace       = Off      ; Show error traces
; xdebug.show_exception_trace   = Off      ; Show exception traces
; xdebug.show_local_vars        = Off      ; Show local variables
; xdebug.start_upon_error       = "default"; Start debugger on error
; xdebug.start_with_request     = "default"; Start debugger with request
; xdebug.trace_format           = 0        ; Trace file format
; xdebug.trace_options          = 0        ; Trace options
; xdebug.trace_output_name      = "trace.%c" ; Trace file name
; xdebug.trigger_value          =          ; Trigger value
; xdebug.use_compression        = 0        ; Compress trace files
; xdebug.var_display_max_children= 128      ; Max array children displayed
; xdebug.var_display_max_data   = 512      ; Max string length displayed
