[PHP]

;--------------------------------
; Assertion
;--------------------------------

; assert.active                 = 1        ; Enable/disable assert() evaluation
; assert.bail                   = 0        ; Stop execution on failed assertion
; assert.callback               =          ; Function called on failed assertion
; assert.exception              = 0        ; Throw exception on assertion failure
; assert.quiet_eval             = 0        ; Suppress errors in evaluated code
; assert.warning                = 1        ; Show warning when assertion fails
; zend.assertions               = 1        ; Control assertion generation (1=enabled, -1=disabled)

;--------------------------------
; CGI
;--------------------------------

; cgi.check_shebang_line        = 1        ; Check for #! line in scripts
; cgi.discard_path              = 0        ; Ignore script path in request
; cgi.fix_pathinfo              = 1        ; Try to fix PATH_INFO in CGI mode
; cgi.force_redirect            = 1        ; Prevent direct access via URL
; cgi.nph                       = 0        ; Enable non-parsed headers mode
; cgi.redirect_status_env       =          ; Use custom env var for redirect status
; cgi.rfc2616_headers           = 0        ; Use RFC 2616 compliant headers

;--------------------------------
; Directories
;--------------------------------

; doc_root                      =          ; Root directory for PHP files
extension_dir                   = "{root_dir}/modules/{module_name}/PHP/ext" ; Directory for PHP extensions
include_path                    = ".;{root_dir}/data/{module_name}/{profile_name}/composer" ; Include search paths
sys_temp_dir                    = "{root_dir}/temp/{module_name}/{profile_name}" ; System temporary directory
upload_tmp_dir                  = "{root_dir}/temp/upload" ; Directory for file uploads
; user_dir                      =          ; User-specific script directory

;--------------------------------
; Encodings
;--------------------------------

; default_charset               = "UTF-8"  ; Default character encoding
; default_mimetype              = "text/html" ; Default MIME type
; input_encoding                =          ; Input encoding
; internal_encoding             =          ; Internal script encoding
; output_encoding               =          ; Output encoding
; zend.detect_unicode           = On       ; Detect BOM in scripts
; zend.multibyte                = Off      ; Enable multibyte support in scripts
; zend.script_encoding          =          ; Define script encoding

;--------------------------------
; Error reporting
;--------------------------------

; display_errors                = On       ; Show errors on output
; display_startup_errors        = Off      ; Show errors during startup
; docref_ext                    =          ; Extension for documentation links
; docref_root                   =          ; Root URL for documentation
; error_append_string           =          ; String appended after errors
error_log                       = "{root_dir}/logs/{module_name}/php_error.log" ; File for logging errors
; error_prepend_string          =          ; String prepended before errors
error_reporting                 = E_ALL & ~E_NOTICE ; Error reporting level
; html_errors                   = On       ; Show errors in HTML format
; ignore_repeated_errors        = Off      ; Ignore duplicate error messages
; ignore_repeated_source        = Off      ; Ignore duplicate error sources
log_errors                      = On       ; Save error messages to log file
; log_errors_max_len            = 1024     ; Max length of logged errors
report_memleaks                 = Off      ; Report memory leaks
report_zend_debug               = Off      ; Report Zend Engine debug info
; track_errors                  = Off      ; Store last error in $php_errormsg
; windows.show_crt_warning      = Off      ; Show CRT warnings on Windows
; xmlrpc_error_number           = 0        ; XML-RPC error code
; xmlrpc_errors                 = Off      ; Generate XML-RPC errors

;--------------------------------
; Flags
;--------------------------------

; allow_url_fopen               = On       ; Allow URL-aware fopen wrappers
; allow_url_include             = Off      ; Allow including remote files
; auto_detect_line_endings      = 0        ; Detect line endings automatically
; auto_globals_jit              = On       ; Delay initialization of superglobals
; engine                        = 1        ; Enable/disable PHP engine
enable_dl                       = Off      ; Enable dynamic loading with dl()
; enable_post_data_reading      = On       ; Read POST data
; expose_php                    = On       ; Expose PHP version in headers
; file_uploads                  = On       ; Allow file uploads
; ignore_user_abort             = Off      ; Keep running after client abort
; implicit_flush                = Off      ; Flush output after every print
; last_modified                 = 0        ; Send Last-Modified header
; register_argc_argv            = On       ; Register argc and argv
; short_open_tag                = On       ; Allow <? short tags

;--------------------------------
; Limits
;--------------------------------

; default_socket_timeout        = 60       ; Default socket timeout (sec)
; hard_timeout                  = 2        ; Hard timeout for script execution
max_execution_time              = 300      ; Max script execution time (sec)
; max_file_uploads              = 20       ; Max simultaneous file uploads
; max_input_nesting_level       = 64       ; Max nesting for input vars
; max_input_time                = -1       ; Max time spent parsing input
max_input_vars                  = 10000    ; Max number of input variables
; max_multipart_body_parts      = -1       ; Max multipart body parts
memory_limit                    = 1024M    ; Max memory per script
output_buffering                = 4096     ; Output buffering size
post_max_size                   = 256M     ; Max POST data size
; precision                     = 14       ; Floating point precision
; realpath_cache_size           = 4096K    ; Cache size for realpath
; realpath_cache_ttl            = 120      ; TTL for realpath cache
; serialize_precision           = -1       ; Floating point serialization precision
upload_max_filesize             = 256M     ; Max size for uploaded files
; user_ini.cache_ttl            = 300      ; TTL for user .ini files

;--------------------------------
; Mail
;--------------------------------

mail.add_x_header               = On       ; Add X-PHP-Originating-Script header
; mail.force_extra_parameters   =          ; Extra params for sendmail
mail.log                        = "{root_dir}/logs/{module_name}/php_mail.log"     ; Log file for mail()
; sendmail_from                 =          ; Default From address
; sendmail_path                 =          ; Path to sendmail program
SMTP                            = "localhost" ; SMTP server
smtp_port                       = 25       ; SMTP port

;--------------------------------
; Security
;--------------------------------

; disable_classes               =          ; Disable specified classes
; disable_functions             = "apache_setenv,dl,exec,passthru,pcntl_exec,pcntl_fork,popen,proc_open,putenv,shell_exec,symlink,system,virtual" ; Disable dangerous functions
; open_basedir                  = "{root_dir}/home;{root_dir}/temp;{root_dir}/data/{module_name}/{profile_name}/composer" ; Restrict script file access

;--------------------------------
; Zlib
;--------------------------------

; zlib.output_compression       = Off      ; Enable/disable output compression
; zlib.output_compression_level = -1       ; Compression level
; zlib.output_handler           =          ; Output handler

;--------------------------------
; Other
;--------------------------------

; arg_separator.input           = "&"      ; Input arg separator
; arg_separator.output          = "&"      ; Output arg separator
; auto_append_file              =          ; Auto-append file at script end
; auto_prepend_file             =          ; Auto-prepend file at script start
; browscap                      = "{root_dir}/user/browscap/lite_php_browscap.ini" ; Browser capabilities file
cli_server.color                = On       ; Enable color for built-in CLI server
; from                          = "john@doe.com" ; Default anonymous FTP password
; highlight.comment             = "#FF8000" ; Color for comments
; highlight.default             = "#0000BB" ; Color for default text
; highlight.html                = "#000000" ; Color for HTML
; highlight.keyword             = "#007700" ; Color for keywords
; highlight.string              = "#DD0000" ; Color for strings
; output_handler                =          ; Output handler function
request_order                   = GP       ; Request order variables
; unserialize_callback_func     =          ; Callback for unserialize()
; url_rewriter.hosts            =          ; Hosts for URL rewriting
; url_rewriter.tags             = "form="  ; Tags for URL rewriter
; user_agent                    =          ; Default user-agent string
; user_ini.filename             = ".user.ini" ; User INI filename
variables_order                 = GPCS     ; Order of superglobals
; zend.enable_gc                = On       ; Enable Zend garbage collection

