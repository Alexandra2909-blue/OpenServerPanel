; amqp.write_timeout            = 0        ; Write timeout

[apcu]

; apc.coredump_unmap            = Off      ; Disable shared memory on coredump
apc.enable_cli                  = On       ; Enable APCu for CLI
apc.enabled                     = On       ; Enable APCu
