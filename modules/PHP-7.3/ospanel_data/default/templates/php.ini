;---------------------------------------
; Extensions settings
;---------------------------------------

[amqp]

; amqp.auto_ack                        = 0                      ; Enable automatic message acknowledgements (0/1). 1 means messages are auto-acked on delivery.
amqp.cacert                            = "{root_dir}/data/ssl/cacert.pem"  ; Path to CA certificate file for verifying AMQP server TLS certificates.
; amqp.cert                            =                        ; Path to client certificate file for mutual TLS authentication.
; amqp.channel_max                     = 256                    ; Maximum number of channels per AMQP connection (0 = server decides; typical default 2047/65535).
; amqp.connect_timeout                 = 0                      ; Connection timeout in seconds for opening AMQP connections (0 = infinite).
; amqp.frame_max                       = 131072                 ; Maximum AMQP frame size in bytes (negotiated with server).
; amqp.global_prefetch_count           = 0                      ; Global QoS prefetch messages count across all consumers (0 = unlimited).
; amqp.global_prefetch_size            = 0                      ; Global QoS prefetch size in octets across all consumers (0 = unlimited).
; amqp.heartbeat                       = 0                      ; Heartbeat interval in seconds for connection liveness (0 = disabled, typical 60s).
; amqp.host                            = "localhost"            ; Default AMQP broker hostname.
; amqp.key                             =                        ; Path to client private key file for TLS authentication (if separate from cert).
; amqp.login                           = "guest"                ; Default AMQP username.
; amqp.password                        = "guest"                ; Default AMQP password.
; amqp.port                            = 5672                   ; Default AMQP broker TCP port (5672 for AMQP, 5671 for AMQPS).
; amqp.prefetch_count                  = 3                      ; QoS prefetch messages count per consumer/channel (0 = unlimited).
; amqp.prefetch_size                   = 0                      ; QoS prefetch size per consumer/channel in octets (0 = unlimited).
; amqp.read_timeout                    = 0                      ; Socket read timeout in seconds for AMQP operations (0 = infinite).
; amqp.rpc_timeout                     = 0                      ; Timeout in seconds for RPC-style AMQP calls (0 = infinite).
; amqp.sasl_method                     = 0                      ; SASL auth method. Common: AMQP_SASL_METHOD_PLAIN, AMQP_SASL_METHOD_EXTERNAL.
; amqp.timeout                         =                        ; General AMQP socket timeout in seconds for I/O (legacy/driver dependent).
; amqp.verify                          = 1                      ; Verify peer certificate when using TLS (0/1).
; amqp.vhost                           = "/"                    ; Default AMQP virtual host to connect to.
; amqp.write_timeout                   = 0                      ; Socket write timeout in seconds for AMQP operations (0 = infinite).

[apcu]

; apc.coredump_unmap                   = Off                    ; Attempt to unmap shared memory segments on crash to avoid large core dumps (Off/On).
apc.enable_cli                         = On                     ; Enable APCu in CLI SAPIs (On/Off).
apc.enabled                            = On                     ; Enable APCu shared memory cache (On/Off).
; apc.entries_hint                     = 0                      ; Hint for expected number of cache entries (0 lets APCu decide).
; apc.gc_ttl                           = 3600                   ; Seconds a cache entry can remain in the garbage collection list.
; apc.preload_path                     =                        ; Directory to preload into APCu at startup (optional).
apc.serializer                         = "igbinary"             ; Serializer to use for APCu values. Common: 'php', 'igbinary', 'msgpack'.
; apc.shm_segments                     = 1                      ; Number of shared memory segments to use for APCu.
; apc.shm_size                         = 32M                    ; Size of the APCu shared memory segment, e.g. 64M.
; apc.slam_defense                     = Off                    ; Protect against cache stampede by delaying writes (On/Off).
; apc.smart                            = 0                      ; Smart memory allocation (legacy/experimental flag).
; apc.ttl                              = 0                      ; Default time-to-live for cache entries (0 = infinite).
; apc.use_request_time                 = Off                    ; Use request start time for TTL calculations (On/Off).

[awscrt]

; awscrt.log_level                     =                        ; AWS CRT PHP log level. Values: 'Trace','Debug','Info','Warn','Error','Fatal'.

[bcmath]

; bcmath.scale                         = 0                      ; Default scale (number of decimal digits) for BCMath operations.

[blackfire]

; blackfire.agent_socket               = "tcp://127.0.0.1:8307"  ; Blackfire agent socket address (tcp://host:port or unix:///path.sock).
; blackfire.apm_agent_timeout_ms       = 300                    ; Timeout in milliseconds for APM agent communication.
; blackfire.apm_browser_collector_endpoint =                    ; Custom endpoint for browser RUM collection.
; blackfire.apm_browser_key            =                        ; Browser key for RUM injection.
; blackfire.apm_browser_pixel_url      =                        ; Pixel URL for RUM beaconing.
; blackfire.apm_browser_probe_url      =                        ; Probe loader URL injected in pages for RUM.
; blackfire.apm_connect_at_startup     = 0                      ; Connect to Blackfire agent at PHP startup (0/1).
; blackfire.apm_enable_automatic_browser_probe = 1              ; Automatically inject browser probe (0/1).
; blackfire.apm_enabled                = 1                      ; Enable Blackfire APM features (0/1).
; blackfire.apm_lock_duration          = 300                    ; Lock duration (seconds) to throttle repeated APM events.
; blackfire.debug.sigsegv_handler      = 0                      ; Enable Blackfire SIGSEGV handler for debugging (0/1).
; blackfire.env_id                     =                        ; Blackfire environment ID (APM/Profiling destination).
; blackfire.env_token                  =                        ; Blackfire environment token (secret).
; blackfire.features.auto_profiling    = 1                      ; Automatically profile requests based on triggers (0/1).
; blackfire.features.curl              = 1                      ; Enable cURL integrations/instrumentation (0/1).
; blackfire.features.embedded_code     = 1                      ; Enable embedded code profiling (0/1).
; blackfire.hostname                   =                        ; Override hostname reported by Blackfire.
blackfire.log_file                     = "{root_dir}/logs/{module_name}/blackfire.log"  ; Path to Blackfire log file (STDERR by default).
; blackfire.log_level                  = 1                      ; Blackfire log level. Values: 0=Quiet,1=Error,2=Warning,3=Info,4=Debug.
; blackfire.server_id                  =                        ; Blackfire server ID (legacy agent authentication).
; blackfire.server_token               =                        ; Blackfire server token (legacy agent authentication).

[com_dotnet]

; com.allow_dcom                       = 0                      ; Allow Distributed COM (DCOM) remote activation in com_dotnet (Off/On).
; com.autoregister_casesensitive       = 1                      ; Make COM class names case-sensitive (0/1).
; com.autoregister_typelib             = 0                      ; Auto-register typelibs for COM (Off/On).
; com.autoregister_verbose             = 0                      ; Verbose output when auto-registering typelibs (Off/On).
; com.code_page                        =                        ; Code page number for COM string conversions (empty = system default).
; com.typelib_file                     =                        ; Path to a type library (TLB) file to register for COM use.

[couchbase]

; couchbase.allow_fallback_to_bucket_connection = 0             ; Allow fallback to bucket-level connection when cluster auth fails (0/1).
; couchbase.decoder.json_arrays        = 1                      ; Return JSON as arrays (1) or objects (0) when decoding.
; couchbase.encoder.compression        = off                    ; Client-side compression for values. Values: 'off','fastlz','zlib','lz4' (depending on build).
; couchbase.encoder.compression_factor = 0.0                    ; Compression factor (tuning parameter for some algorithms).
; couchbase.encoder.compression_threshold = 0                   ; Minimum value size (bytes) before attempting compression (0 disables threshold check).
; couchbase.encoder.format             = json                   ; Value format. Values: 'json','serialize','binary'.
; couchbase.log_level                  = WARN                   ; Couchbase client log level. Values: TRACE, DEBUG, INFO, WARN, ERROR, FATAL.
; couchbase.pool.max_idle_time_sec     = 60                     ; Maximum idle time (seconds) for pooled connections.

[curl]

curl.cainfo                            = "{root_dir}/data/ssl/cacert.pem"  ; Path to a bundle of CA certificates for SSL verification in cURL.

