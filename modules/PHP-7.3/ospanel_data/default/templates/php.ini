[PHP]

;---------------------------------------
; Assertion
;---------------------------------------

; assert.active                        = On                     ; Enable Zend assertions (On/Off). Disabled in production for performance.
; assert.bail                          = Off                    ; Stop execution on failed assertion (On/Off).
; assert.callback                      =                        ; User callback invoked on assertion failure. Empty to disable.
; assert.exception                     = Off                    ; Throw AssertionError on failed assertion instead of warning (On/Off).
; assert.quiet_eval                    = Off                    ; Suppress errors from eval() used by assert(). Deprecated/removed.
assert.warning                         = On                     ; Emit a warning on failed assertion (On/Off).
; zend.assertions                      = 1                      ; Controls compilation of assert(): 1=generate, 0=optimize, -1=remove.

;---------------------------------------
; CGI
;---------------------------------------

; cgi.check_shebang_line               = 1                      ; Respect shebang (#!) line in scripts when running CGI (0/1).
; cgi.discard_path                     = 0                      ; Ignore script filename in PATH_INFO for security (0/1).
cgi.fix_pathinfo                       = 0                      ; Enable PATH_INFO processing under CGI (0/1).
; cgi.force_redirect                   = 1                      ; Force redirect to prevent unauthorized CGI invocation (0/1).
; cgi.nph                              = 0                      ; Use non-parsed headers mode for CGI (0/1).
; cgi.redirect_status_env              =                        ; Environment variable name to pass redirect status; empty disables.
; cgi.rfc2616_headers                  = 0                      ; Send Status header in RFC 2616 format (0/1).

;---------------------------------------
; Directories
;---------------------------------------

; doc_root                             =                        ; Document root directory for PHP scripts; empty to accept server default.
extension_dir                          = "{root_dir}/modules/{module_name}/ext"  ; Directory where PHP looks for loadable extensions (.so/.dll).
include_path                           = ".;{root_dir}/data/{module_name}/{profile_name}/composer"  ; List of directories for require/include, separated by PATH_SEPARATOR.
sys_temp_dir                           = "{root_dir}/temp/{module_name}/{profile_name}"  ; System temporary directory used by PHP (uploads, sessions, etc.).
upload_tmp_dir                         = "{root_dir}/temp/upload"  ; Temporary directory for HTTP file uploads; falls back to system temp if empty.
; user_dir                             =                        ; User directory name for ~username style paths (Apache only).

;---------------------------------------
; Encodings
;---------------------------------------

; default_charset                      = "UTF-8"                ; Default output charset for HTML and other content (e.g., UTF-8).
; default_mimetype                     = "text/html"            ; Default MIME type for output (e.g., text/html).
; input_encoding                       =                        ; Default input encoding for multibyte support; empty auto-detect or default.
; internal_encoding                    =                        ; Default internal string encoding for mbstring; empty to use default.
; output_encoding                      =                        ; Default output encoding for mbstring; empty to use default.
; zend.detect_unicode                  = On                     ; Detect Unicode BOM at script start (On/Off).
; zend.multibyte                       = Off                    ; Enable multibyte script encoding detection (On/Off).
; zend.script_encoding                 =                        ; Script encoding name when zend.multibyte is enabled (e.g., SJIS, EUC-JP).

;---------------------------------------
; Error reporting
;---------------------------------------

; display_errors                       = On                     ; Display runtime errors to output (On/Off). Off in production.
; display_startup_errors               = Off                    ; Display PHP startup sequence errors (On/Off).
; docref_ext                           =                        ; Append extension to docref links (e.g., .html) in error messages.
; docref_root                          =                        ; Base URL for documentation references in error messages.
; error_append_string                  =                        ; String appended to error messages output.
error_log                              = "{root_dir}/logs/{module_name}/php_error.log"  ; File path or syslog for error logging; leave empty to use SAPI logging.
; error_prepend_string                 =                        ; String prepended to error messages output.
error_reporting                        = E_ALL & ~E_NOTICE      ; Error levels to report (bitmask). Common: E_ALL, exclude with ~E_NOTICE, ~E_DEPRECATED.
; html_errors                          = On                     ; Format errors as HTML (On/Off).
; ignore_repeated_errors               = Off                    ; Suppress repeated identical error messages (On/Off).
; ignore_repeated_source               = Off                    ; Ignore source line in repeat error detection (On/Off).
log_errors                             = On                     ; Log errors to error_log (On/Off).
; log_errors_max_len                   = 1024                   ; Max length of each logged error line in bytes (0 for unlimited).
report_memleaks                        = Off                    ; Report memory leaks detected by Zend MM (On/Off).
report_zend_debug                      = Off                    ; Include Zend Engine debug info in error messages (On/Off).
; track_errors                         = Off                    ; Store last error message in $php_errormsg (On/Off). Removed in PHP 8.
; windows.show_crt_warning             = Off                    ; Suppress MSVC CRT warnings on Windows (On/Off).
; xmlrpc_error_number                  = 0                      ; Custom XML-RPC fault code integer.
; xmlrpc_errors                        = Off                    ; Send XML-RPC errors as XML faults instead of standard errors (On/Off).

;---------------------------------------
; Flags
;---------------------------------------

; allow_url_fopen                      = On                     ; Allow URL-aware fopen wrappers (http, ftp, etc.) (On/Off).
; allow_url_include                    = Off                    ; Allow include/require via URL wrappers (On/Off). Security risk when On.
; auto_detect_line_endings             = Off                    ; Detect Macintosh/Unix/DOS line endings in text files (On/Off).
; auto_globals_jit                     = On                     ; Delay initialization of $GLOBALS like $_SERVER until used (On/Off).
; engine                               = 1                      ; Enable PHP engine (1) or disable to pass-through files (0).
enable_dl                              = Off                    ; Allow dl() to load extensions at runtime (On/Off). Disabled on thread-safe/most SAPIs.
; enable_post_data_reading             = On                     ; Automatically read POST data for php://input and $_POST (On/Off).
; expose_php                           = On                     ; Add X-Powered-By header with PHP version (On/Off).
; file_uploads                         = On                     ; Enable HTTP file uploads (On/Off).
; ignore_user_abort                    = Off                    ; Continue script execution even if client disconnects (On/Off).
; implicit_flush                       = Off                    ; Flush output after every output call (On/Off).
; last_modified                        = 0                      ; Set Last-Modified header automatically (timestamp or 0 to disable).
; register_argc_argv                   = On                     ; Populate $argc and $argv in non-CLI SAPIs (On/Off).
; short_open_tag                       = On                     ; Allow short open tag '<?' for PHP code (On/Off). Always allowed for '<?='.

;---------------------------------------
; Limits
;---------------------------------------

; default_socket_timeout               = 60                     ; Default timeout (seconds) for socket-based streams.
; hard_timeout                         = 2                      ; SAPI-specific hard timeout for request handling (seconds).
max_execution_time                     = 600                    ; Maximum script execution time in seconds (0 for unlimited).
; max_file_uploads                     = 50                     ; Maximum number of files allowed per upload request.
; max_input_nesting_level              = 64                     ; Max nesting level of input variables arrays (e.g., $_GET depth).
max_input_time                         = 120                    ; Max time in seconds to parse input data (POST/GET) (−1 unlimited).
max_input_vars                         = 10000                  ; Max number of input variables accepted (per request).
; max_multipart_body_parts             = -1                     ; Max parts allowed in multipart/form-data (−1 unlimited).
memory_limit                           = 1024M                  ; Max memory a script may consume (e.g., 128M, -1 unlimited).
output_buffering                       = Off                    ; Enable output buffering (On/Off or size in bytes).
post_max_size                          = 512M                   ; Max size of POST data allowed (e.g., 8M). Must be ≥ upload_max_filesize.
; precision                            = 14                     ; Number of significant digits for floating point output.
; realpath_cache_size                  = 4096K                  ; Size of realpath cache (e.g., 4096K).
; realpath_cache_ttl                   = 120                    ; TTL for realpath cache entries in seconds.
; serialize_precision                  = -1                     ; Precision for serialize()/json_encode floats (−1 uses full precision policy).
upload_max_filesize                    = 512M                   ; Max size for uploaded files (e.g., 2M).
; user_ini.cache_ttl                   = 300                    ; TTL in seconds for user INI (.user.ini) files.

;---------------------------------------
; Mail
;---------------------------------------

mail.add_x_header                      = On                     ; Add X-PHP-Originating-Script header to mail() (On/Off).
; mail.force_extra_parameters          =                        ; Extra command-line params for sendmail (e.g., -f sender).
mail.log                               = "{root_dir}/logs/{module_name}/php_mail.log"  ; Log each mail() call to file or syslog.
; sendmail_from                        =                        ; Default From address for Windows mail().
; sendmail_path                        =                        ; Path to sendmail-compatible binary and flags (e.g., /usr/sbin/sendmail -t -i).
SMTP                                   = "localhost"            ; SMTP server hostname for Windows mail().
smtp_port                              = 25                     ; SMTP server port for Windows mail() (default 25).

;---------------------------------------
; Other
;---------------------------------------

; arg_separator.input                  = "&"                    ; Input argument separator(s) for URL parsing (default '&').
; arg_separator.output                 = "&"                    ; Separator used when generating URLs (default '&').
; auto_append_file                     =                        ; Script appended automatically to output at request end.
; auto_prepend_file                    =                        ; Script prepended automatically before main script.
; browscap                             = "{root_dir}/user/browscap/lite_php_browscap.ini"  ; Path to browscap.ini for user agent capability detection.
cli_server.color                       = On                     ; Colorize CLI built-in webserver output (On/Off).
; from                                 = "john@doe.com"         ; Define the anonymous ftp password (your email address)
; highlight.comment                    = "#FF8000"              ; Syntax highlight color for comments (HTML color).
; highlight.default                    = "#0000BB"              ; Syntax highlight color for default text (HTML color).
; highlight.html                       = "#000000"              ; Syntax highlight color for HTML (HTML color).
; highlight.keyword                    = "#007700"              ; Syntax highlight color for keywords (HTML color).
; highlight.string                     = "#DD0000"              ; Syntax highlight color for strings (HTML color).
; output_handler                       =                        ; Output buffering handler (e.g., ob_gzhandler). Avoid combining with zlib.output_handler.
request_order                          = "GP"                   ; Order of populating $_REQUEST (e.g., GPC, GP).
; unserialize_callback_func            =                        ; Callback called when unserialize() encounters undefined class.
; url_rewriter.hosts                   =                        ; Hostname whitelist for transparent SID rewriting across hosts.
; url_rewriter.tags                    = "form="                ; HTML tags/attributes to rewrite with session ID (e.g., form=, a=href).
; user_agent                           =                        ; Default HTTP User-Agent header for stream wrappers.
; user_ini.filename                    = ".user.ini"            ; Filename for per-directory user INI files (e.g., .user.ini).
variables_order                        = "GPCS"                 ; Order to register EGPCS variables (Environment, GET, POST, Cookie, Server).
; zend.enable_gc                       = On                     ; Enable Zend Garbage Collector for cyclic garbage (On/Off).

;---------------------------------------
; Security
;---------------------------------------

; disable_classes                      =                        ; Comma-separated list of classes to disable.
; disable_functions                    = "apache_setenv,dl,exec,passthru,pcntl_exec,pcntl_fork,popen,proc_open,putenv,shell_exec,symlink,system,virtual"  ; Comma-separated list of functions to disable (e.g., exec, system).
; open_basedir                         = "{root_dir}/home;{root_dir}/temp;{root_dir}/data/{module_name}/{profile_name}/composer"  ; Restrict file operations to specified directory tree(s); semicolon separated.

;---------------------------------------
; Syslog
;---------------------------------------

; syslog.facility                      = LOG_USER               ; Syslog facility to use (e.g., LOG_USER, LOG_MAIL, LOG_LOCAL0..7).
; syslog.filter                        = no-ctrl                ; Syslog filter mode (e.g., no-ctrl to remove control chars).
; syslog.ident                         = php                    ; Syslog ident string (tag) used for log entries.

;---------------------------------------
; Zlib
;---------------------------------------

; zlib.output_compression              = Off                    ; Compress output using zlib (On/Off or level).
; zlib.output_compression_level        = -1                     ; Compression level for zlib output (−1 default, 0..9).
; zlib.output_handler                  =                        ; Output handler for zlib (e.g., ob_gzhandler). Mutually exclusive with output_handler.

