[amqp]

amqp.cacert                      = "{root_dir}/data/ssl/cacert.pem" ; Path to CA certificate
; amqp.auto_ack                   = 0                         ; Enable automatic message acknowledgment
; amqp.cert                       =                           ; Path to client certificate
; amqp.channel_max                = 256                       ; Max number of channels per connection
; amqp.connect_timeout            = 0                         ; Connection timeout (seconds)
; amqp.frame_max                  = 131072                    ; Maximum frame size
; amqp.global_prefetch_count      = 0                         ; Global prefetch message count
; amqp.global_prefetch_size       = 0                         ; Global prefetch size (bytes)
; amqp.heartbeat                  = 0                         ; Heartbeat interval
; amqp.host                       = "localhost"               ; RabbitMQ host
; amqp.key                        =                           ; Path to private key
; amqp.login                      = "guest"                   ; Login username
; amqp.password                   = "guest"                   ; Login password
; amqp.port                       = 5672                      ; RabbitMQ port
; amqp.prefetch_count             = 3                         ; Prefetch message count
; amqp.prefetch_size              = 0                         ; Prefetch size (bytes)
; amqp.read_timeout               = 0                         ; Read timeout (seconds)
; amqp.rpc_timeout                = 0                         ; RPC call timeout (seconds)
; amqp.sasl_method                = 0                         ; SASL authentication method
; amqp.timeout                    =                           ; Connection timeout
; amqp.verify                     = 1                         ; Verify SSL certificate
; amqp.vhost                      = "/"                       ; Virtual host
; amqp.write_timeout              = 0                         ; Write timeout (seconds)

[apcu]

apc.enable_cli                   = On                        ; Enable APCu for CLI
apc.enabled                      = On                        ; Enable APCu
apc.serializer                   = "igbinary"                ; Serializer type
; apc.coredump_unmap              = Off                       ; Unmap shared memory on coredump
; apc.entries_hint                = 0                         ; Hint about number of cache entries
; apc.gc_ttl                      = 3600                      ; Time-to-live for garbage collection
; apc.preload_path                =                           ; Path to preload cache entries
; apc.shm_segments                = 1                         ; Number of shared memory segments
; apc.shm_size                    = 32M                       ; Shared memory size
; apc.slam_defense                = Off                       ; Protect against cache slam
; apc.smart                       = 0                         ; Smart memory allocation
; apc.ttl                         = 0                         ; Default TTL for entries
; apc.use_request_time            = Off                       ; Use request time for TTL

[awscrt]

; awscrt.log_level                =                           ; AWS CRT log level

[bcmath]

