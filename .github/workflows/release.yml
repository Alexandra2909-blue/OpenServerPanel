name: Build Open Server Panel

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 6.4.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repo with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure LFS files are pulled
        run: |
          git lfs install
          git lfs pull

      # ВОССТАНОВЛЕНИЕ КЭША ЗАГРУЗОК
      - name: Restore downloads cache
        uses: actions/cache@v4
        with:
          path: cache
          key: downloads-${{ inputs.version }}-${{ hashFiles('resources/matrix/*.json', 'generate/genall.ps1', 'resources/composer/*') }}
          restore-keys: |
            downloads-${{ inputs.version }}-
            downloads-

      # На случай первого запуска — создаём папку кэша
      - name: Ensure cache folder exists
        shell: pwsh
        run: |
          if (-not (Test-Path "cache")) { New-Item -ItemType Directory -Path "cache" -Force | Out-Null }
          Write-Host "Cache folder ready: $(Resolve-Path cache)"

      - name: Remove old Inno Setup (if exists)
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6") {
            Remove-Item "C:\Program Files (x86)\Inno Setup 6" -Recurse -Force
          }

      - name: Download and install Inno Setup 6
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile "innosetup.exe"
          Start-Process .\innosetup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait

      - name: Set version in OpenServerPanel.iss
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            Write-Error "Version input is empty."
            exit 1
          }
          if ($ver -notmatch '^\d+(\.\d+)*$') {
            Write-Error "Version must look like 6.4.0"
            exit 1
          }
          $verUnderscore = $ver -replace '\.', '_'

          $issPath = "OpenServerPanel.iss"
          if (-not (Test-Path $issPath)) {
            Write-Error "OpenServerPanel.iss not found at $issPath"
            exit 1
          }

          $content = Get-Content -Raw -Path $issPath
          $content = $content -replace '(?m)^\#define\s+AppVersion\s+.*$', "#define AppVersion      `"$ver`""
          $content = $content -replace '(?m)^\#define\s+AppVersion_\s+.*$', "#define AppVersion_     `"$verUnderscore`""
          Set-Content -Path $issPath -Value $content -Encoding UTF8

          Write-Host "Set AppVersion to $ver and AppVersion_ to $verUnderscore in OpenServerPanel.iss"

      # Подготовка данных PostgreSQL: очистка/ACL для data и temp
      - name: Prepare PostgreSQL data dirs (reset ACL and owner)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Reset-AclRecursive {
            param([string]$Path)
            if (-not (Test-Path $Path)) { return }

            attrib -r -h -s "$Path" /S /D 2>$null
            icacls "$Path" /inheritance:e /T /C | Out-Null

            try { Remove-Item "$Path" -Recurse -Force -ErrorAction SilentlyContinue } catch {}
            New-Item -ItemType Directory -Force -Path "$Path" | Out-Null

            icacls "$Path" /inheritance:d /T /C | Out-Null

            $me = "$env:USERDOMAIN\$env:USERNAME"
            takeown /F "$Path" /R /D Y | Out-Null
            cmd /c "icacls ""$Path"" /setowner ""$me"" /T /C" | Out-Null

            icacls "$Path" /grant:r "${me}:(OI)(CI)F" /T /C | Out-Null
            icacls "$Path" /grant:r "*S-1-5-18:(OI)(CI)F" /T /C | Out-Null      # SYSTEM
            icacls "$Path" /grant:r "*S-1-5-32-545:(OI)(CI)F" /T /C | Out-Null  # BUILTIN\Users

            attrib -r -h -s "$Path" /S /D 2>$null
          }

          $modules = Join-Path (Get-Location) 'modules'
          $pgVers = 11..17 | ForEach-Object { "PostgreSQL-$_" }
          foreach ($v in $pgVers) {
            $mod   = Join-Path $modules $v
            $data  = Join-Path $mod 'ospanel_data\default_data'
            $tmp   = Join-Path $mod 'temp'
            Reset-AclRecursive -Path $data
            Reset-AclRecursive -Path $tmp
          }

          Start-Sleep -Seconds 2

      - name: Run generators (genall.ps1 and gendb.bat)
        shell: pwsh
        env:
          TMP:  D:\a\_temp
          TEMP: D:\a\_temp
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:TEMP)) { New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null }

          # Листинг кэша перед генерацией (для диагностики)
          if (Test-Path "..\cache") {
            Write-Host "Pre-run cache listing (..\\cache):"
            Get-ChildItem -Recurse -Force "..\cache" | Select-Object FullName, Length | Format-Table -AutoSize
          } elseif (Test-Path "cache") {
            Write-Host "Pre-run cache listing (cache):"
            Get-ChildItem -Recurse -Force "cache" | Select-Object FullName, Length | Format-Table -AutoSize
          }

          Set-Location generate
          # genall.ps1 использует $CacheDir = "..\cache" — это указывает на корневую папку cache
          .\genall.ps1
          # gendb.bat — инициализация БД
          cmd /c gendb.bat
          Set-Location ..

      - name: Compile installer (OpenServerPanel.iss)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup ISCC.exe not found at $iscc"
            exit 1
          }
          & $iscc "OpenServerPanel.iss"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-server-panel-setup
          path: release/*.exe

      # Диагностика содержимого кэша перед сохранением
      - name: List cache dir
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "cache") {
            Write-Host "Post-run cache listing:"
            Get-ChildItem -Recurse -Force "cache" | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "Cache directory not found."
          }

      # СОХРАНЕНИЕ КЭША ПОСЛЕ СБОРКИ
      - name: Save downloads cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: downloads-${{ inputs.version }}-${{ hashFiles('resources/matrix/*.json', 'generate/genall.ps1', 'resources/composer/*') }}
