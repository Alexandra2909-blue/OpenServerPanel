data_directory                  = '{root_dir}/modules/{module_name}/ospanel_data/default_data'
hba_file                        = '{root_dir}/generate/config/postgresql/pg_hba.conf'
ident_file                      = '{root_dir}/generate/config/postgresql/pg_ident.conf'
listen_addresses                = 127.0.0.1
port                            = 5432
max_connections                 = 128
ssl                             = off
shared_buffers                  = 128MB
dynamic_shared_memory_type      = windows
max_wal_size                    = 1GB
min_wal_size                    = 80MB
log_destination                 = 'stderr'
logging_collector               = off
log_min_messages                = notice
log_line_prefix                 = '%m [%p] '
log_statement                   = 'none'
log_timezone                    = 'Etc/GMT-3'
track_counts                    = on
autovacuum                      = on
datestyle                       = 'iso, ymd'
timezone                        = 'Etc/GMT-3'
lc_messages                     = 'C'
lc_monetary                     = 'C'
lc_numeric                      = 'C'
lc_time                         = 'C'
default_text_search_config      = 'pg_catalog.russian'
