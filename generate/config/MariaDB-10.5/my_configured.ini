[client]

plugin_dir              = "lib/plugin"
host                    = 127.0.0.1
port                    = 3306
socket                  = database
user                    = root

[mysql]

no-beep
default-character-set   = utf8mb4
local_infile            = 1

[mysqld]

# General Settings

bind_address            = 127.0.0.1
character_set_server    = utf8mb4
collation_server        = utf8mb4_unicode_ci
datadir                 = "data"
default_storage_engine  = InnoDB
default_time_zone      = Etc/GMT-3
explicit_defaults_for_timestamp = 1
ft_min_word_len         = 3
lc_messages             = en_US
lc_messages_dir         = "share"
local_infile            = 1
lower_case_table_names  = 2
performance_schema      = 0
pid_file                = "database.pid"
plugin_dir              = "lib/plugin"
port                    = 3306
secure_file_priv        = "temp"
server_id               = 1
socket                  = 127.0.0.1
tmpdir                  = "temp"

# Skip Settings

#skip-grant-tables
skip-log-bin
skip-ssl

# Cache Settings

query_cache_limit       = 256K
query_cache_size        = 32M
query_cache_type        = 1

# Connection Settings

max_connections         = 128
max_connect_errors      = 32
thread_cache_size       = 4

# InnoDB Settings

innodb_buffer_pool_size = 160M
innodb_data_file_path   = ibdata1:10M:autoextend
innodb_data_home_dir    = "data"
innodb_file_per_table   = 1
#innodb_force_recovery  = 1
innodb_log_file_size    = 32M

# Logging

general_log_file        = "temp/query_log.log"

# MyISAM Settings

key_buffer_size         = 32M
myisam_recover_options  = backup,force
aria_recover_options    = backup,force

# Table Settings

table_definition_cache  = 4096
table_open_cache        = 4096
max_heap_table_size     = 128M
tmp_table_size          = 16M

[aria_chk]

datadir                 = "data"
tmpdir                  = "temp"

[aria_read_log]

tmpdir                  = "temp"

[ariapack]

datadir                 = "data"

[myisamchk]

key_buffer_size         = 32M
tmpdir                  = "temp"

[mysqladmin]

no-beep
default-character-set   = utf8mb4

[mysqlcheck]

default-character-set   = utf8mb4

[mysqldump]

quick
quote_names
max_allowed_packet      = 32M

[mysqlimport]

default-character-set   = utf8mb4

[mysqlshow]

default-character-set   = utf8mb4
keys                    = 0
show-table-type         = 0
status                  = 0