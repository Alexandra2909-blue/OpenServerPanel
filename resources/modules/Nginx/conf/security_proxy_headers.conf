# Hide security-related headers in proxied responses

proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Referrer-Policy;
proxy_hide_header Timing-Allow-Origin;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;

proxy_hide_header Content-Security-Policy;
proxy_hide_header Cross-Origin-Embedder-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;

# Security-related response headers

add_header Access-Control-Allow-Origin   $cors                              always;
add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
add_header Timing-Allow-Origin           "*"                                always;
add_header X-Content-Type-Options        "nosniff"                          always;
add_header X-Frame-Options               "SAMEORIGIN"                       always;

add_header Cross-Origin-Embedder-Policy  "require-corp"                     always;
add_header Cross-Origin-Opener-Policy    "same-origin"                      always;
add_header Cross-Origin-Resource-Policy  "same-origin"                      always;
add_header Permissions-Policy            "interest-cohort=()"               always;

add_header Content-Security-Policy       "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; frame-ancestors 'self';"       always;
# add_header Content-Security-Policy     "default-src 'self'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests";

