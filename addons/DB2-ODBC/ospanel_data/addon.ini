[main]

architecture             = x64
category                 = DB2-ODBC
enabled                  = on
license                  = https://www.ibm.com/docs/en/db2/11.5.x?topic=applications-license-requirements
license_type             = Software without a license
min_windows_ver          = 6.1.7601
timestamp                = 1651770000
version                  = 11.5.0

[docs]

English                  = https://www.ibm.com/docs/en/db2/11.5.x?topic=apis-cli-odbc

[environment]

ALTHOSTNAME              = 
ALTPORT                  = 
AUTHENTICATION           = 
BIDI                     = 
DB2_CLI_DRIVER_INSTALL_PATH = {root_dir}\addons\{addon_name}
DB2_ENABLE_LDAP          = 
DB2_FORCE_NLS_CACHE      = 
DB2_NO_FORK_CHECK        = 
DB2ACCOUNT               = 
DB2BIDI                  = 
DB2CLIINIPATH            = 
DB2CODEPAGE              = 
DB2DIAGPATH              = 
DB2DOMAINLIST            = 
DB2DSDRIVER_CFG_PATH     = 
DB2DSDRIVER_CLIENT_HOSTNAME = 
DB2GRAPHICUNICODESERVER  = 
DB2LDAP_BASEDN           = 
DB2LDAP_CLIENT_PROVIDER  = 
DB2LDAP_KEEP_CONNECTION  = 
DB2LDAP_SEARCH_SCOPE     = 
DB2LDAPHOST              = 
DB2LOCALE                = 
DB2NOEXITLIST            = 
DB2SORCVBUF              = 
DB2SOSNDBUF              = 
DB2TCP_CLIENT_RCVTIMEOUT = 
DB2TERRITORY             = 
IBM_DB_HOME              = {root_dir}\addons\{addon_name}
INSTANCE                 = 
KRBPLUGIN                = 
PATH                     = {root_dir}\addons\{addon_name}\bin;{root_dir}\addons\{addon_name}\adm;%PATH%
PROTOCOL                 = 
PWDPLUGIN                = 

[addon_env.bat]

comment                  = ::
destination              = {root_dir}\data\cli\env_{addon_name}.bat
directory_separator      = \
enabled                  = on
encoding                 = UTF8
source_dir               = {root_dir}\system\templates

